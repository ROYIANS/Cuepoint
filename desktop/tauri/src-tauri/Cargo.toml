[package]
name = "cuepoint-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "cuepoint_native_storage"

[[bin]]
name = "workspace_probe"
path = "src/bin/workspace_probe.rs"
required-features = ["test-hooks"]

[features]
default = []
test-hooks = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]
acceptance = ["desktop"]

[[bin]]
name = "cuepoint-prototype"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
uuid = { version = "=1.28.0", features = ["v4"] }
tauri = { version = "=2.12.2", optional = true , features = [] }
tauri-plugin-dialog = { version = "=2.8.1", optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true , features = [] }
