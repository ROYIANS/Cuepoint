</style><style type="text/css" data-vite-dev-id="/Users/xiaomengdao/WebstormProjects/aifenjing/src/components/agent/taskWorkspace.css">/* Shared task surfaces: quiet structural lines, one card level, white studio accents. */
.agent-task-board {
    --task-line: rgba(255, 255, 255, .09);
    --task-muted: #949494;
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow-y: auto;
    background: #090909;
    padding: 40px 40px 56px;
    color: #ededed;
    font-size: 14px;
    scrollbar-gutter: stable;
}

.agent-task-board-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    max-width: 1560px;
    margin: 0 auto 40px;
}

.agent-task-back {
    margin: 0 0 24px -8px;
    color: var(--task-muted);
}

.agent-task-eyebrow {
    display: flex;
    gap: 12px;
    align-items: center;
    color: #acacac;
    font-size: 12px;
    letter-spacing: .12em;
    margin-bottom: 16px;
}

.agent-task-eyebrow span {
    color: #555;
}

.agent-task-board-heading h1 {
    font-size: clamp(24px, 2.3vw, 36px);
    line-height: 1.4;
    letter-spacing: -.035em;
    font-weight: 550;
}

.agent-task-board-heading h1 > span {
    color: #6d6d6d;
}

.agent-task-board-heading p {
    color: var(--task-muted);
    font-size: 14px;
    margin-top: 12px;
    line-height: 1.75;
}

.agent-task-create {
    min-height: 40px;
    border-radius: 10px;
    margin-bottom: 4px;
}

.agent-task-board-toolbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding-bottom: 20px;
    max-width: 1560px;
    margin: 0 auto;
    border-bottom: 1px solid var(--task-line);
}

.agent-task-filters {
    display: flex;
    align-items: center;
    gap: 4px;
}

.agent-task-filters button {
    padding: 8px 12px;
    border-radius: 8px;
    color: var(--task-muted);
    transition: background .15s, color .15s;
    white-space: nowrap;
}

.agent-task-filters button[aria-pressed="true"] {
    color: #f5f5f5;
    background: #ffffff10;
}

.agent-task-filters button:hover {
    color: white;
    background: #ffffff09;
}

.agent-task-board-count {
    font-size: 12px;
    color: #777;
    white-space: nowrap;
}

.agent-task-search {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 260px;
    width: 100%;
    margin-left: auto;
    padding: 8px 0 8px 12px;
    color: #858585;
}

.agent-task-search input {
    background: transparent;
    width: 100%;
    outline: none;
    min-width: 0;
    color: #e8e8e8;
    height: 24px;
    font-size: 14px;
}

.agent-task-search:focus-within {
    color: #eee;
    box-shadow: 0 1px 0 #aaa;
}

.agent-task-columns {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    max-width: 1560px;
    margin: 0 auto;
}

.agent-task-column {
    padding: 24px 16px;
    min-width: 0;
    border-left: 1px solid var(--task-line);
    min-height: 320px;
}

.agent-task-column:first-child {
    border-left: 0;
    padding-left: 0;
}

.agent-task-column:last-child {
    padding-right: 0;
}

.agent-task-column > header {
    display: flex;
    align-items: center;
    gap: 8px;
}

.agent-task-column > header h2 {
    font-size: 14px;
    font-weight: 550;
}

.agent-task-column > header > span:last-child {
    margin-left: auto;
    color: #808080;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
}

.agent-task-state-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #888;
}

.agent-task-state-dot.is-running {
    background: #dedede;
    box-shadow: 0 0 0 3px #ffffff10;
}

.agent-task-state-dot.is-attention {
    background: #d4b476;
}

.agent-task-state-dot.is-done {
    background: #90ad96;
}

.agent-task-column-hint {
    color: #757575;
    font-size: 12px;
    margin: 8px 0 20px;
}

.agent-task-column-empty {
    padding: 28px 8px;
    border-top: 1px dashed #ffffff0c;
    color: #737373;
    text-align: center;
    font-size: 12px;
}

.agent-task-card {
    display: block;
    width: 100%;
    background: #171717e8;
    border: 1px solid #ffffff0b;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    text-align: left;
    transition: background .18s, border-color .18s, transform .18s;
    cursor: pointer;
}

.agent-task-card:hover {
    background: #1e1e1e;
    border-color: #ffffff22;
    transform: translateY(-2px);
}

.agent-task-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.agent-task-card-top > svg {
    color: #777;
    transition: color .15s;
}

.agent-task-card:hover .agent-task-card-top > svg {
    color: #fff;
}

.agent-task-status {
    font-size: 12px;
    color: #aaa;
}

.agent-task-status.is-running {
    color: #e9e9e9;
}

.agent-task-status.is-review, .agent-task-status.is-approval, .agent-task-status.is-interrupted {
    color: #dcc08a;
}

.agent-task-status.is-failed {
    color: #e39b96;
}

.agent-task-status.is-completed {
    color: #abc5af;
}

.agent-task-card h3 {
    font-size: 16px;
    line-height: 1.6;
    font-weight: 500;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.agent-task-card > p {
    font-size: 12px;
    line-height: 1.8;
    color: #969696;
    margin-top: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
}

.agent-task-card footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
    color: #8d8d8d;
    font-size: 12px;
}

.agent-task-card footer > span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

.agent-task-mini-progress, .agent-task-progress {
    height: 3px;
    border-radius: 3px;
    overflow: hidden;
    background: #ffffff0b;
    margin-top: 20px;
}

.agent-task-mini-progress > span, .agent-task-progress > span {
    display: block;
    height: 100%;
    background: #b5b5b5;
    border-radius: inherit;
    transition: width .25s;
}

.agent-task-empty {
    text-align: center;
    min-height: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
}

.agent-task-empty > svg {
    color: #9d9d9d;
}

.agent-task-empty h2 {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -.025em;
}

.agent-task-empty p {
    color: #999;
    line-height: 1.85;
